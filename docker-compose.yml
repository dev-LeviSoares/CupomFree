version: '3'

services: 
  cupomfree-pg:
    image: bitnami/postgresql
    ports:
      - 5432:5432
    environment:
      - POSTGRESQL_USERNAME=docker
      - POSTGRESQL_PASSWORD=docker
      - POSTGRESQL_DATABASE=cupomfree
    volumes:
      - cupomfree_pg_data:/bitnami/postgresql

volumes:
  cupomfree_pg_data: